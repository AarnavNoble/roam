# Railway / nixpacks build. The Docker image (Dockerfile) is the primary
# deployment; this is kept for platforms that build from source.
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
# CPU-only torch first, so sentence-transformers does not pull the CUDA build.
cmds = [
  "pip install torch --index-url https://download.pytorch.org/whl/cpu",
  "pip install -r backend/requirements.txt",
]

[start]
cmd = "bash startup.sh"
