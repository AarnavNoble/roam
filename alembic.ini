[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
# The URL comes from backend.config (DATABASE_URL), see migrations/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
